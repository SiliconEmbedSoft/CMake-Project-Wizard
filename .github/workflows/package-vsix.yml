name: Package VSIX

on:
  push:
    tags:
      - 'v*'          # e.g. v1.0.1
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create and push a git tag from package.json version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------
  # Optional: create a git tag (vX.Y.Z) from package.json version.
  # ----------------------------------------------------------------
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: create
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # STEP 1: Build the VSIX first. Always runs.
  # ----------------------------------------------------------------
  package:
    needs: [tag]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # no cache: 'npm' — this repo has no committed lockfile

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package extension (build VSIX)
        run: vsce package --out "${{ steps.pkg.outputs.vsix }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

  # ----------------------------------------------------------------
  # STEP 2: Release AFTER the VSIX is built. Downloads the artifact
  # and attaches it to the GitHub Release.
  # ----------------------------------------------------------------
  release:
    needs: [tag, package]
    if: >
      ${{ always() &&
          needs.package.result == 'success' &&
          (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.package.outputs.vsix }}
          name: v${{ needs.package.outputs.version }}
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          generate_release_notes: true
